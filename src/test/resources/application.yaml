spring:
  datasource:
    url: jdbc:h2:mem:upi;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

jwt:
  secret: test-secret-key-that-is-long-enough-for-hs256-123456789
  expiration: 3600000
